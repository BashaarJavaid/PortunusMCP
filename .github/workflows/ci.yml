# CI per ARCHITECTURE.md §12: lint, typecheck, test + coverage gate, docker build
# on every push/PR; benchmark-on-merge (main only, §9) uploads the latency report
# as an artifact. Image push happens in release.yml on tag, not here.

name: ci

on:
  push:
  pull_request:

jobs:
  devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            set -euo pipefail
            state=portunusmcp-quickstart
            namespace_before="$(sed -n "s/^QUICKSTART_NAMESPACE='\([^']*\)'$/\1/p" "$state/.env.quickstart")"
            credentials_before="$(sha256sum "$state/credentials.env" | cut -d ' ' -f 1)"
            .devcontainer/post-create.sh
            namespace_after="$(sed -n "s/^QUICKSTART_NAMESPACE='\([^']*\)'$/\1/p" "$state/.env.quickstart")"
            credentials_after="$(sha256sum "$state/credentials.env" | cut -d ' ' -f 1)"
            test -n "$namespace_before"
            test "$namespace_before" = "$namespace_after"
            test "$credentials_before" = "$credentials_after"
            .venv/bin/portunusmcp --json doctor "$state" > /tmp/doctor.json
            .venv/bin/python -c 'import json; report=json.load(open("/tmp/doctor.json")); assert report["summary"]["ERROR"] == 0; assert any(item["id"] == "runtime.readiness" and item["status"] == "PASS" for item in report["findings"])'
            git diff --exit-code -- .devcontainer/devcontainer-lock.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy services/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portunusmcp
          POSTGRES_PASSWORD: portunusmcp
          POSTGRES_DB: portunusmcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portunusmcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://portunusmcp:portunusmcp@localhost:5432/portunusmcp
      REDIS_URL: redis://localhost:6379/0
      UPSTREAM_RUNTIME_NAMESPACE: portunusmcp-ci
      REQUIRE_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: docker build -t portunusmcp:dev .
      # Service containers are up, so the integration/adversarial suites run
      # for real here — the reachability skip in clean_audit must not fire, and
      # item 48's installed quickstart must prove ALLOW + DENY_RBAC end to end.
      - run: pytest --cov=services --cov-fail-under=80

  benchmark:
    # §9: on merge to main only, never per-PR, to keep PR CI fast.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portunusmcp
          POSTGRES_PASSWORD: portunusmcp
          POSTGRES_DB: portunusmcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portunusmcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://portunusmcp:portunusmcp@localhost:5432/portunusmcp
      REDIS_URL: redis://localhost:6379/0
      UPSTREAM_RUNTIME_NAMESPACE: portunusmcp-benchmark
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: docker build -t portunusmcp:dev .
      # N=100 (vs the local default 1000) keeps the job practical on a shared
      # runner; the fixed 10/50/100-session concurrency scenarios are unaffected.
      # Runner numbers track regressions between runs, they don't replace the
      # measured numbers in the README's Performance section.
      - run: python -m tests.benchmarks.run 100
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: tests/benchmarks/reports/
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
