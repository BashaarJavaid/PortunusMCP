# DEVELOPMENT/DEMO ONLY.
# This stack intentionally publishes Postgres, Redis, the rogue mutation service,
# and anonymous monitoring with local default credentials. Never deploy it.
name: portunusmcp-demo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portunusmcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portunusmcp}
      POSTGRES_DB: ${POSTGRES_DB:-portunusmcp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portunusmcp} -d ${POSTGRES_DB:-portunusmcp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build: .
    image: portunusmcp:dev
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://portunusmcp:portunusmcp@postgres:5432/portunusmcp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Upstream container specs live in the policy's `servers:` block (item 39).
      POLICY_FILE: ${POLICY_FILE:-policies/example-policy.yaml}
      # Signed-identity secret for the demo policy's ci-agent (item 34): the YAML
      # names this var; the value never enters the policy file or the repo.
      PORTUNUSMCP_DEMO_SIGNING_SECRET: ${PORTUNUSMCP_DEMO_SIGNING_SECRET:-}
      PORTUNUSMCP_DEMO_TOTP_SECRET: ${PORTUNUSMCP_DEMO_TOTP_SECRET:-}
      BUSINESS_HOURS_START_UTC: ${BUSINESS_HOURS_START_UTC:-9}
      BUSINESS_HOURS_END_UTC: ${BUSINESS_HOURS_END_UTC:-18}
      MAX_MCP_BODY_BYTES: ${MAX_MCP_BODY_BYTES:-1048576}
      MAX_JSON_DEPTH: ${MAX_JSON_DEPTH:-32}
      MAX_SESSIONS_PER_IDENTITY: ${MAX_SESSIONS_PER_IDENTITY:-3}
      MAX_INFLIGHT_CALLS_PER_IDENTITY: ${MAX_INFLIGHT_CALLS_PER_IDENTITY:-5}
      TOOL_CALL_RATE_LIMIT: ${TOOL_CALL_RATE_LIMIT:-60}
      TOOL_CALL_RATE_WINDOW_SECONDS: ${TOOL_CALL_RATE_WINDOW_SECONDS:-60}
      AUTH_FAILURE_RATE_LIMIT: ${AUTH_FAILURE_RATE_LIMIT:-5}
      AUTH_FAILURE_RATE_WINDOW_SECONDS: ${AUTH_FAILURE_RATE_WINDOW_SECONDS:-300}
      TOOL_CALL_DEADLINE_SECONDS: ${TOOL_CALL_DEADLINE_SECONDS:-60}
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-1.0}
      ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["localhost:*","127.0.0.1:*"]}'
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-[]}'
      # Metrics default to loopback (config.py) so a bare-host run doesn't expose
      # identity ids / tool names. Here the port is unpublished, so the compose
      # network is the boundary and Prometheus needs to reach it.
      METRICS_HOST: "0.0.0.0"
      UPSTREAM_RUNTIME_NAMESPACE: ${UPSTREAM_RUNTIME_NAMESPACE:?set UPSTREAM_RUNTIME_NAMESPACE}
      DOCKER_HOST: unix:///var/run/docker.sock
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID to the docker.sock group id}
    volumes:
      # Item 42 owns policy promotion and audit-key rotation inside these roots.
      - ./policies:/app/policies
      - ./secrets:/app/secrets
      # Trusted gateway-only Docker control plane. Per-session upstreams never receive it.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)",
        ]
      interval: 5s
      timeout: 2s
      retries: 3

  # Detective control (§5): its downtime never blocks gateway traffic.
  verifier:
    build: .
    image: portunusmcp:dev
    command: python scripts/audit_verifier_daemon.py
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://portunusmcp:portunusmcp@postgres:5432/portunusmcp}
      SIGNING_PUBLIC_KEYS_DIR: /app/secrets/public
      VERIFY_INTERVAL_SECONDS: ${VERIFY_INTERVAL_SECONDS:-60}
      METRICS_PORT: "9101"
      METRICS_HOST: "0.0.0.0"
    volumes:
      # Only the append-only public keyring is read; private keys never enter here.
      - ./secrets/public:/app/secrets/public:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Rogue-demo admin endpoint (item 14): mutation is a real, operator-triggered call —
  # curl -X POST localhost:9800/_admin/apply_mutation — never a timer. The rogue MCP
  # server itself runs in per-session isolated containers (the demo policy registers
  # it); this service only hosts the mutation endpoint, sharing a named volume.
  rogue:
    build: .
    image: portunusmcp:dev
    user: "0:0"
    command: python sample_target/rogue_server.py --admin --port 9800 --state /rogue-state/state.json
    volumes:
      - rogue_state:/rogue-state
    ports:
      - "9800:9800"

  # Observability (§7, item 25): opt-in with compose.demo.yml's monitoring profile.
  # Prometheus scrapes gateway:9100 / verifier:9101 over the compose network only —
  # those ports are deliberately not published (metric labels carry identity ids and
  # tool names); the §7 posture is unauthenticated-but-internal.
  prometheus:
    image: prom/prometheus:v3.4.1
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.0.2
    profiles: ["monitoring"]
    environment:
      # Local dev dashboard — anonymous read access, no login wall.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  rogue_state:
    name: portunusmcp-upstream-${UPSTREAM_RUNTIME_NAMESPACE:?set UPSTREAM_RUNTIME_NAMESPACE}-rogue-state
