[project]
name = "portunusmcp"
version = "0.1.0"
description = "Zero-trust, risk-aware gateway proxy for the Model Context Protocol"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.6",
    "jsonschema==4.26.0",
    "mcp==1.28.1",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "canonicaljson==2.0.0",
    "cryptography==49.0.0",
    "redis==5.2.1",
    "pydantic-settings==2.7.0",
    "prometheus-client==0.25.0",
    "pyyaml==6.0.2",
    "structlog==26.1.0",
]

[project.scripts]
portunusmcp = "services.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "types-pyyaml==6.0.12.20260518",
    "types-jsonschema==4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
